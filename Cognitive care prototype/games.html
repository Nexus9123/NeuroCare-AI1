<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Care - Games</title>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #d0e8f2;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .lang-switch {
      position: absolute;
      top: 25px;
      right: 30px;
      display: flex;
      gap: 8px;
    }

    .lang-btn {
      padding: 6px 14px;
      border: 2px solid #2b580c;
      border-radius: 6px;
      background: white;
      color: #2b580c;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-btn.active,
    .lang-btn:hover {
      background: #2b580c;
      color: white;
    }

    h1 {
      margin: 10px 0 5px;
      color: #1e3d59;
      text-align: center;
    }

    h2 {
      margin-bottom: 30px;
      color: #555;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }

    .games-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 30px;
      padding: 0;
      list-style: none;
    }

    .game-card-item {
      padding: 15px 20px;
      border-left: 5px solid #2b580c;
      border-radius: 10px;
      background: #f8f9fa;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: 0.3s;
    }

    .game-card-item:hover {
      transform: translateY(-3px);
      background: #eef5fc;
    }

    .game-card-item a {
      display: block;
      color: #2b580c;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    .back-container { text-align: center; }

    .back-btn {
      display: inline-block;
      padding: 10px 25px;
      border-radius: 8px;
      background: #2b580c;
      color: white;
      font-weight: bold;
      text-decoration: none;
      transition: 0.2s;
    }

    .back-btn:hover { background: #1e3d59; }

    @media (max-width: 600px) {
      .container { margin: 10px auto; padding: 24px 16px; }
      .lang-switch { top: 14px; right: 14px; }
      h1 { margin-top: 55px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="lang-switch">
      <button
        id="btn-en"
        class="lang-btn active"
        type="button"
        onclick="setLanguage('en')"
      >
        English
      </button>

      <button
        id="btn-hi"
        class="lang-btn"
        type="button"
        onclick="setLanguage('hi')"
      >
        हिन्दी
      </button>
    </div>

    <h1 id="page-title">Cognitive Care Games</h1>
    <h2 id="page-subtitle">Select a Game</h2>

    <ul class="games-list">
      <li class="game-card-item">
        <a href="games/memory.html" id="game-1">🧠 Memory Card Match</a>
      </li>

      <li class="game-card-item">
        <a href="games/stroop_game.html" id="game-2">🎨 Stroop Colour Challenge</a>
      </li>

      <li class="game-card-item">
        <a href="games/number_sequence.html" id="game-3">🔢 Number Sequence Memory</a>
      </li>

      <li class="game-card-item">
        <a href="games/reaction_time.html" id="game-4">⚡ Reaction Time</a>
      </li>

      <li class="game-card-item">
        <a href="games/sequence.html" id="game-5">🎨 Sequence Recall</a>
      </li>
    </ul>

    <div class="back-container">
      <a href="dashboard.html" id="back-link" class="back-btn">
        ← Back to Dashboard
      </a>
    </div>
  </main>

  <script>
    function setLanguage(lang) {
      const isHindi = lang === "hi";

      document.getElementById("btn-en").classList.toggle("active", !isHindi);
      document.getElementById("btn-hi").classList.toggle("active", isHindi);

      document.getElementById("page-title").textContent = isHindi
        ? "कॉग्निटिव केयर गेम्स"
        : "Cognitive Care Games";

      document.getElementById("page-subtitle").textContent = isHindi
        ? "एक खेल चुनें"
        : "Select a Game";

      document.getElementById("game-1").textContent = isHindi
        ? "🧠 मेमोरी कार्ड मिलान"
        : "🧠 Memory Card Match";

      document.getElementById("game-2").textContent = isHindi
        ? "🎨 स्ट्रूप रंग चुनौती"
        : "🎨 Stroop Colour Challenge";

      document.getElementById("game-3").textContent = isHindi
        ? "🔢 नंबर अनुक्रम स्मृति"
        : "🔢 Number Sequence Memory";

      document.getElementById("game-4").textContent = isHindi
        ? "⚡ प्रतिक्रिया समय"
        : "⚡ Reaction Time";

      document.getElementById("game-5").textContent = isHindi
        ? "🎨 अनुक्रम स्मरण"
        : "🎨 Sequence Recall";

      document.getElementById("back-link").textContent = isHindi
        ? "← डैशबोर्ड पर वापस जाएं"
        : "← Back to Dashboard";
    }
  </script>
</body>
</html>
